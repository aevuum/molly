services:
  bot:
    build: .
    container_name: molly_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: molly_bot_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: molly_bot
      POSTGRES_USER: molly
      POSTGRES_PASSWORD: molly8567

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molly -d molly_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: